title: 1gould
description: "A personal profile and technical notes."
url: "https://1gould.github.io"
baseurl: ""
lang: en
timezone: Etc/UTC
markdown: kramdown
highlighter: rouge
permalink: /posts/:year/:month/:day/:title/
strict_front_matter: true

kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - local
  - README.md
  - docker-compose.yaml
