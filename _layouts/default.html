<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title != 'Home' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml" sizes="any">
    <link rel="preload" href="{{ '/assets/fonts/IoskeleyMono-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} home"><span aria-hidden="true">~/</span> {{ site.title | escape }}</a>
        <a class="github-link" href="https://github.com/1gould">GitHub <span aria-hidden="true">↗</span></a>
      </header>
      <main id="main" tabindex="-1">{{ content }}</main>
      <footer class="site-footer">
        <span>{{ site.title | escape }}</span>
        <span>Written in Markdown. Built with <a href="https://jekyllrb.com/">Jekyll</a>.</span>
      </footer>
    </div>
  </body>
</html>
